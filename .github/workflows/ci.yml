name: CI

on:
  push:
    branches: ["main", "master", "dev", "feature/**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: pytest · Python 3.11
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

    steps:
      # ---------------------------------------------------------------
      # 1. Source
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2. Python — pinned to 3.11 (TF 2.15 does not support 3.12)
      # ---------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ---------------------------------------------------------------
      # 3. Dependencies
      #    Install the project in editable mode with dev extras.
      #    requirements.txt provides the exact ML stack pins.
      #    TensorFlow on Linux CPU installs cleanly without GPU drivers.
      # ---------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install -e ".[dev]"

      # ---------------------------------------------------------------
      # 4. DeepFace patch
      #    DeepFace 0.0.93 unconditionally sets TF_USE_LEGACY_KERAS=1,
      #    which breaks tensorflow.keras on TF 2.15. The patch makes the
      #    flag conditional on TF >= 2.16 so TF 2.15 keeps tf.keras.
      #    See docs/deepface_runtime_rootcause.md for full analysis.
      # ---------------------------------------------------------------
      - name: Patch DeepFace for TF 2.15 compatibility
        run: python scripts/patch_deepface_tf215.py

      # ---------------------------------------------------------------
      # 5. Smoke import check
      #    Verifies the patch worked before running the full suite.
      # ---------------------------------------------------------------
      - name: Verify imports
        run: |
          python -c "import src; import tools; import eval.harness; print('imports OK')"
          python -c "from src.ai_engine import _get_deepface; print('ai_engine OK')"

      # ---------------------------------------------------------------
      # 6. Test suite
      #    - system tests are excluded (require camera / GPU)
      #    - coverage is measured across src/, tools/, eval/
      #    - JUnit XML enables GitHub test summary annotations
      # ---------------------------------------------------------------
      - name: Run tests with coverage
        run: |
          pytest \
            -m "not system" \
            --cov=src \
            --cov=tools \
            --cov=eval \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            --junit-xml=test-results.xml \
            -q

      # ---------------------------------------------------------------
      # 7. Publish test results as GitHub PR annotation
      # ---------------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 14

      # ---------------------------------------------------------------
      # 8. Publish coverage report
      # ---------------------------------------------------------------
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

      # ---------------------------------------------------------------
      # 9. Coverage summary (posted to step summary, visible in PR)
      # ---------------------------------------------------------------
      - name: Coverage summary
        if: always()
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.get('line-rate', 0)) * 100
          branch_rate = float(root.get('branch-rate', 0)) * 100
          print(f'## Coverage Summary')
          print(f'- **Line coverage:** {line_rate:.1f}%')
          print(f'- **Branch coverage:** {branch_rate:.1f}%')
          " >> \$GITHUB_STEP_SUMMARY
