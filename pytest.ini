[pytest]
# Run from project root: pytest
testpaths = tests eval/tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --strict-config
filterwarnings =
    ignore::DeprecationWarning

markers =
    unit: Fast, isolated tests with no webcam, GPU, or DeepFace.
    integration: Cross-module tests with mocks/fakes for heavy dependencies.
    system: End-to-end flows; may require camera and full ML stack (manual/CI optional).
    pad: Presentation Attack Detection (pad_engine) tests.
